[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "moment-distribution-method"
version = "0.1.0"
description = "Browser GUI calculator for continuous beams using the Hardy Cross moment distribution method."
readme = "README.md"
requires-python = ">=3.8"
authors = [
  { name = "Moment Distribution Method Contributors" }
]
keywords = ["structural-analysis", "moment-distribution", "hardy-cross", "continuous-beam"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.scripts]
mdm-gui = "mdm:main"

[tool.setuptools]
py-modules = ["mdm"]
